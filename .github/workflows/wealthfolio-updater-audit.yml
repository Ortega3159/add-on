name: Wealthfolio updater audit

on:
  push:
    branches:
      - feat/wealthfolio-updater
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit updater state
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout audited commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.2'
          check-latest: false

      - name: Run offline updater tests
        run: python -m unittest discover -s scripts/wealthfolio_updater/tests -p 'test_*.py'

      - name: Run read-only updater audit
        run: |
          python -m scripts.wealthfolio_updater.audit_cli \
            --repository-root . \
            --expected-git-sha '${{ github.sha }}' \
            --markdown-output "$GITHUB_STEP_SUMMARY"
