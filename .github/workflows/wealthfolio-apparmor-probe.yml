name: Wealthfolio AppArmor diagnostic probe

on:
  push:
    branches:
      - chore/wealthfolio-apparmor-probe

permissions:
  contents: read

jobs:
  apparmor:
    name: Diagnose AppArmor on GitHub-hosted Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Fetch exact commit
        shell: bash
        run: |
          set -euo pipefail

          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Inspect runner security environment
        shell: bash
        run: |
          set -euo pipefail

          uname -a
          docker version
          docker info --format 'SecurityOptions={{json .SecurityOptions}}'
          apparmor_parser --version

          test "$(cat /sys/module/apparmor/parameters/enabled)" = "Y"
          command -v apparmor_parser
          command -v aa-status
          sudo aa-status

      - name: Prepare and load CI-equivalent AppArmor profile
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_PROFILE="tracker/apparmor.txt"
          TEST_PROFILE="${RUNNER_TEMP}/wealthfolio-apparmor-ci.txt"

          echo "=== Source line endings ==="
          file "$SOURCE_PROFILE"

          # Normalize only the temporary copy. The repository profile is not
          # modified by this probe.
          tr -d '\r' < "$SOURCE_PROFILE" > "$TEST_PROFILE"

          BARE_SIGNAL_COUNT="$(
            grep -Ec '^[[:space:]]*signal receive,$' "$TEST_PROFILE" || true
          )"

          printf 'bare signal receive rules: %s\n' "$BARE_SIGNAL_COUNT"
          test "$BARE_SIGNAL_COUNT" -eq 3

          # AppArmor 4.0.1 on Ubuntu 24.04 rejects the bare form accepted by
          # the HAOS environment. Use the semantically equivalent form in the
          # temporary CI copy.
          sed -Ei \
            's/^([[:space:]]*)signal receive,$/\1signal (receive),/' \
            "$TEST_PROFILE"

          test "$(
            grep -Ec '^[[:space:]]*signal \(receive\),$' "$TEST_PROFILE" || true
          )" -eq 3

          echo "=== CI-only syntax adaptation ==="
          diff -u \
            <(tr -d '\r' < "$SOURCE_PROFILE") \
            "$TEST_PROFILE" \
            || true

          sudo apparmor_parser -r -W "$TEST_PROFILE"

          sudo aa-status \
            | grep -E 'wealthfolio($|//wealthfolio-server$)'

          printf 'TEST_PROFILE=%s\n' "$TEST_PROFILE" >> "$GITHUB_ENV"

      - name: Build known-good wrapper
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            --pull \
            --build-arg BUILD_VERSION=3.6.3-3 \
            --build-arg BUILD_ARCH=amd64 \
            -t wealthfolio-aa-probe:3.6.3-3 \
            tracker

      - name: Compare Docker default vs custom AppArmor
        shell: bash
        run: |
          set -euo pipefail

          BASELINE_CONTAINER="wf-aa-baseline"
          CONFINED_CONTAINER="wf-aa-confined"
          BASELINE_DATA=""
          CONFINED_DATA=""

          cleanup() {
            [ -z "$BASELINE_CONTAINER" ] \
              || docker rm -f "$BASELINE_CONTAINER" >/dev/null 2>&1 || true
            [ -z "$CONFINED_CONTAINER" ] \
              || docker rm -f "$CONFINED_CONTAINER" >/dev/null 2>&1 || true

            [ -z "$BASELINE_DATA" ] || rm -rf "$BASELINE_DATA"
            [ -z "$CONFINED_DATA" ] || rm -rf "$CONFINED_DATA"

            if [ -n "${TEST_PROFILE:-}" ] && [ -f "$TEST_PROFILE" ]; then
              sudo apparmor_parser -R "$TEST_PROFILE" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          make_data_dir() {
            target_dir="$(mktemp -d)"

            # GNU mktemp intentionally creates directories with no group/other
            # permissions (normally 0700). That is secure on the host, but it
            # is not a faithful /data simulation after the wrapper drops from
            # root to the upstream `wealthfolio` user: the process must be able
            # to traverse the bind-mounted /data root.
            chmod 0755 "$target_dir"

            cat > "${target_dir}/options.json" <<'JSON'
          {
            "auth_password_hash": "$argon2id$v=19$m=19456,t=2,p=1$d2VhbHRoZm9saW8tY2ktc2FsdA$0S06Pkzh1UOb4foQLdD7/CHINd64HR17scQLwtJD0MU",
            "cors_allow_origins": "http://127.0.0.1:8088",
            "auth_token_ttl_minutes": 480
          }
          JSON

            chmod 0644 "${target_dir}/options.json"

            printf '%s\n' "$target_dir"
          }

          show_data_permissions() {
            label="$1"
            data_dir="$2"

            echo "=== ${label} /data host permissions ==="
            stat -c 'path=%n mode=%a owner=%u:%g' "$data_dir"
            stat -c 'path=%n mode=%a owner=%u:%g' "$data_dir/options.json"
          }

          container_port() {
            docker inspect \
              --format '{{(index (index .NetworkSettings.Ports "8088/tcp") 0).HostPort}}' \
              "$1"
          }

          wait_for_health() {
            container="$1"
            port="$2"

            for _ in $(seq 1 60); do
              if curl --fail --silent \
                "http://127.0.0.1:${port}/api/v1/healthz" >/dev/null; then
                return 0
              fi

              if [ "$(docker inspect --format '{{.State.Running}}' "$container")" != "true" ]; then
                return 1
              fi

              sleep 2
            done

            return 1
          }

          dump_wealthfolio_denials() {
            echo "=== Wealthfolio AppArmor DENIED records ==="

            denials="$(
              sudo dmesg --color=never 2>/dev/null \
                | grep 'apparmor="DENIED"' \
                | grep -E 'profile="wealthfolio(//wealthfolio-server)?"' \
                || true
            )"

            if [ -n "$denials" ]; then
              printf '%s\n' "$denials"
              return 0
            fi

            echo "No matching DENIED records found in dmesg."

            echo "=== Kernel journal fallback ==="
            sudo journalctl -k --no-pager 2>/dev/null \
              | grep 'apparmor="DENIED"' \
              | grep -E 'profile="wealthfolio(//wealthfolio-server)?"' \
              || true
          }

          echo "=== CONTROL A: standard Docker AppArmor (docker-default) ==="

          BASELINE_DATA="$(make_data_dir)"
          show_data_permissions "CONTROL A" "$BASELINE_DATA"

          docker run -d \
            --name "$BASELINE_CONTAINER" \
            --init \
            --tmpfs /tmp \
            -p 127.0.0.1::8088 \
            -v "$BASELINE_DATA:/data" \
            -e WF_LISTEN_ADDR=0.0.0.0:8088 \
            -e WF_DB_PATH=/data/wealthfolio/wealthfolio.db \
            -e WF_AUTH_REQUIRED=true \
            -e WF_MCP_ENABLED=false \
            wealthfolio-aa-probe:3.6.3-3

          BASELINE_PROFILE="$(
            docker inspect --format '{{.AppArmorProfile}}' "$BASELINE_CONTAINER"
          )"
          printf 'baseline Docker AppArmor profile: %s\n' "$BASELINE_PROFILE"

          BASELINE_PORT="$(container_port "$BASELINE_CONTAINER")"

          if ! wait_for_health "$BASELINE_CONTAINER" "$BASELINE_PORT"; then
            echo "CONTROL A FAILED: known-good wrapper is not healthy under docker-default." >&2
            docker inspect \
              --format 'running={{.State.Running}} exit={{.State.ExitCode}} error={{json .State.Error}}' \
              "$BASELINE_CONTAINER" || true
            docker logs "$BASELINE_CONTAINER" || true
            exit 1
          fi

          curl --fail --silent \
            "http://127.0.0.1:${BASELINE_PORT}/" >/dev/null

          echo "CONTROL_A=PASS"

          docker rm -f "$BASELINE_CONTAINER" >/dev/null
          BASELINE_CONTAINER=""

          echo "=== CONTROL B: custom wealthfolio AppArmor profile ==="

          CONFINED_DATA="$(make_data_dir)"
          show_data_permissions "CONTROL B" "$CONFINED_DATA"

          docker run -d \
            --name "$CONFINED_CONTAINER" \
            --init \
            --security-opt apparmor=wealthfolio \
            --tmpfs /tmp \
            -p 127.0.0.1::8088 \
            -v "$CONFINED_DATA:/data" \
            -e WF_LISTEN_ADDR=0.0.0.0:8088 \
            -e WF_DB_PATH=/data/wealthfolio/wealthfolio.db \
            -e WF_AUTH_REQUIRED=true \
            -e WF_MCP_ENABLED=false \
            wealthfolio-aa-probe:3.6.3-3

          CONFINED_PROFILE="$(
            docker inspect --format '{{.AppArmorProfile}}' "$CONFINED_CONTAINER"
          )"
          printf 'confined Docker AppArmor profile: %s\n' "$CONFINED_PROFILE"
          test "$CONFINED_PROFILE" = "wealthfolio"

          CONFINED_PORT="$(container_port "$CONFINED_CONTAINER")"

          if ! wait_for_health "$CONFINED_CONTAINER" "$CONFINED_PORT"; then
            echo "CONTROL B FAILED: wrapper is not healthy under custom AppArmor." >&2

            docker inspect \
              --format 'running={{.State.Running}} exit={{.State.ExitCode}} error={{json .State.Error}}' \
              "$CONFINED_CONTAINER" || true

            echo "=== Container logs ==="
            docker logs "$CONFINED_CONTAINER" || true

            dump_wealthfolio_denials

            echo "APPARMOR_DIAGNOSTIC=CONFINED_START_FAILED"
            exit 1
          fi

          echo "CONTROL_B_START=PASS"

          echo "=== Verify child-profile transition ==="

          SERVER_PID="$(
            docker top "$CONFINED_CONTAINER" -eo pid,args \
              | awk '/\/usr\/local\/bin\/wealthfolio-server/ {print $1; exit}'
          )"

          test -n "$SERVER_PID"

          CURRENT_PROFILE="$(sudo cat "/proc/${SERVER_PID}/attr/current")"
          printf 'wealthfolio-server domain: %s\n' "$CURRENT_PROFILE"

          test "$CURRENT_PROFILE" = "wealthfolio//wealthfolio-server (enforce)"

          echo "=== Normal-operation denial check ==="

          NORMAL_DENIALS="$(
            sudo dmesg --color=never 2>/dev/null \
              | grep 'apparmor="DENIED"' \
              | grep -E 'profile="wealthfolio(//wealthfolio-server)?"' \
              || true
          )"

          if [ -n "$NORMAL_DENIALS" ]; then
            printf '%s\n' "$NORMAL_DENIALS"
            echo "Unexpected AppArmor denial during legitimate startup." >&2
            exit 1
          fi

          echo "=== Negative control: prove confinement blocks forbidden write ==="

          if docker exec "$CONFINED_CONTAINER" /bin/sh -c \
            'touch /root/wealthfolio-apparmor-should-deny'; then
            echo "Forbidden write unexpectedly succeeded." >&2
            exit 1
          fi

          sleep 1

          NEGATIVE_DENIALS="$(
            sudo dmesg --color=never 2>/dev/null \
              | grep 'apparmor="DENIED"' \
              | grep -E 'profile="wealthfolio' \
              || true
          )"

          if [ -z "$NEGATIVE_DENIALS" ]; then
            echo "Forbidden operation failed but produced no matching AppArmor denial." >&2
            exit 1
          fi

          printf '%s\n' "$NEGATIVE_DENIALS" | tail -20

          echo "APPARMOR_PROBE=PASS"
